owners:
  - Default

route_templates:
  default: "{category}/{issuer}/{year}"
  Bills: "Bills/{issuer}/{year}"
  Credit Card Statements: "Credit Card Statements/{issuer}/{year}"
  Bank Account & Statements: "Bank Account & Statements/{issuer}/{year}"
  HSA & FSA Transactions: "HSA & FSA Transactions/{year}"
  Mortgage & Home Equity Accounts: "Mortgage & Home Equity Accounts/{account}/{year}"
  Health Statements & Results: "Health Statements & Results/{year}"
  Insurance: "Insurance/{year}"
  Tax Returns: "Tax Returns/{year}"
  Notices: "Notices/{year}"
  Personal: "Personal"
  Paystubs: "Paystubs/{year}"
  Receipts: "Receipts, Payment, Warranty"
  Real Estate & HOA: "Real Estate & HOA"
  Rental Expenses: "Rental/Rental Expenses/{year}"
  FamilyMember: "FamilyMember"

# Minimum keyword hits required to accept a category classification.
min_classification_score: 2

monthly_categories:
  - Bills
  - Credit Card Statements
  - Mortgage & Home Equity Accounts
  - Bank Account & Statements

account_in_filename_categories:
  - Bills
  - Credit Card Statements
  - Mortgage & Home Equity Accounts

# Doc type label appended to issuer in the filename.
doc_types:
  Bills: Monthly
  Credit Card Statements: Statement
  Bank Account & Statements: Statement
  Mortgage & Home Equity Accounts: Statement
  HSA & FSA Transactions: EOB
  Health Statements & Results: EOB
  Insurance: Policy
  Tax Returns: Return
  Notices: Notice
  Personal: Personal
  Paystubs: Paycheck
  Receipts: Receipt
  Real Estate & HOA: HOA
  Rental Expenses: Invoice
  FamilyMember: Document

# Categories where amount is not included in the filename.
no_amount_categories:
  - Real Estate & HOA
  - FamilyMember

# Generic issuer aliases for a publish-safe public example config.
# Keep personal issuer/account mappings in config/routing-config.local.yaml.
known_issuers:
  example bank: Example Bank
  example checking: Example Checking
  example savings: Example Savings
  example card: Example Card
  example credit card: Example Card
  example utility: Example Utility
